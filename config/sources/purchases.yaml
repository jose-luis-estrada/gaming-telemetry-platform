name: purchases
format: parquet
landing_path: purchases
bronze_table: bronze.purchases
checkpoint_path: purchases

# Declared contract. Bronze does not enforce it; Silver does. Deliberately a
# different schema from player_events: the framework ingests columns it has
# never seen with zero new code, because Bronze is schema-on-read.
schema:
  - { name: purchase_id, type: long }
  - { name: player_id, type: long }
  - { name: item_id, type: long }
  - { name: item_category, type: string }
  - { name: currency, type: string }
  - { name: price_usd, type: double }
  - { name: purchase_timestamp, type: timestamp }

# Single producer, single clock. purchase_timestamp is a valid ordering key
# here because one producer means one clock; with N producers it would not be,
# which is why player_events orders on a producer sequence instead.
identity_key: [purchase_id]
ordering_key: [purchase_timestamp]
# No dedup_window_hours: purchases carries no late arrivals or seeded
# duplicates, so the window is unbounded.

quality_rules:
  - { name: purchase_id_not_null, type: row, column: purchase_id, check: not_null }
  - { name: price_usd_not_null,   type: row, column: price_usd,   check: not_null }
