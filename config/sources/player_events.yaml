name: player_events
format: parquet
landing_path: player_events
bronze_table: bronze.player_events
checkpoint_path: player_events

# Declared contract. Bronze does not enforce it; Silver does.
schema:
  - { name: event_id, type: long }
  - { name: player_id, type: long }
  - { name: game_id, type: long }
  - { name: event_type, type: string }
  - { name: event_timestamp, type: timestamp }
  - { name: ingestion_timestamp, type: timestamp }
  - { name: producer_id, type: long }
  - { name: source_sequence_number, type: long }
  - { name: metadata, type: string }
  - { name: stack_trace, type: string }

# Dedup is two questions, kept as two fields:
#   identity_key: which rows are the same event (collapse these to one)
#   ordering_key: which duplicate wins (keep the max on this key)
# The winner is decided by the producer's own counter, never a wall clock:
# with 3 producers there are 3 clocks, and MAX(timestamp) would pick clock skew.
identity_key: [event_id]
ordering_key: [producer_id, source_sequence_number]

# Bounded dedup window: duplicates are reconciled only when copies land within
# this many hours of each other. Derived from the 72h maximum lateness; global
# dedup would reshuffle all history on every run. Must equal
# duplicates.dedup_window_hours in config/manifest.json, or the seeded
# out-of-window duplicates stop being out of window.
dedup_window_hours: 72

quality_rules:
  # --- row-level rules: evaluated per row, failures go to the rejects table ---
  - { name: event_id_not_null,        type: row, column: event_id,        check: not_null }
  - { name: event_timestamp_not_null, type: row, column: event_timestamp, check: not_null }

  # hard: exact invariant. Schema drift is a single clean cutover in event time:
  # once the drift key first appears, no later event uses the old schema.
  # Profile-independent on purpose: no hardcoded date, so the dev and full
  # manifests share one contract. Where the cutover lands (drift_day) is the
  # generator's spec and is tested there, not asserted at ingestion.
  - name: schema_drift_clean_cutover
    type: aggregate
    severity: hard
    query: |
      SELECT COUNT(*) AS observed
      FROM bronze
      WHERE get_json_object(metadata, '$.network_type') IS NULL
        AND event_timestamp >= (
          SELECT MIN(event_timestamp)
          FROM bronze
          WHERE get_json_object(metadata, '$.network_type') IS NOT NULL
        )
    assert: { op: eq, value: 0 }

  # soft: seeded skew. One game_id holds ~37% of events. Statistical, so report
  # expected-vs-observed and pass within tolerance.
  - name: hot_game_share
    type: aggregate
    severity: soft
    query: |
      SELECT MAX(share) AS observed FROM (
        SELECT game_id, COUNT(*) / (SELECT COUNT(*) FROM bronze) AS share
        FROM bronze GROUP BY game_id
      )
    expected: 0.37
    tolerance: 0.02

  # soft: 2-3% of events arrive later than the 300s normal-delay ceiling.
  - name: late_arrival_rate
    type: aggregate
    severity: soft
    query: |
      SELECT
        SUM(CASE WHEN unix_timestamp(ingestion_timestamp) - unix_timestamp(event_timestamp) > 300
                 THEN 1 ELSE 0 END) / COUNT(*) AS observed
      FROM bronze
    expected: 0.025
    tolerance: 0.01