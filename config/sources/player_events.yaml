name: player_events
format: parquet
landing_path: player_events
bronze_table: bronze.player_events
checkpoint_path: player_events

# Declared contract. Bronze does NOT enforce this; Silver will.
schema:
  - { name: event_id, type: long }
  - { name: player_id, type: long }
  - { name: game_id, type: long }
  - { name: event_type, type: string }
  - { name: event_timestamp, type: timestamp }
  - { name: ingestion_timestamp, type: timestamp }
  - { name: producer_id, type: long }
  - { name: source_sequence_number, type: long }
  - { name: metadata, type: string }
  - { name: stack_trace, type: string }

# Used in W5. Dedup is TWO questions, kept as two fields on purpose:
#   identity_key: which rows are the SAME event (collapse these to one)
#   ordering_key: which duplicate WINS (keep the max on this key)
# Conflating them into one dedup_key hid that they mean different things per
# source. Here the winner is the producer's own counter, NEVER a wall clock:
# 3 producers = 3 clocks, so a MAX(timestamp) picks a random clock's noise.
# DDIA Ch 8.
identity_key: [event_id]
ordering_key: [producer_id, source_sequence_number]

# Bounded dedup window. Only reconcile duplicates within this many hours of each
# other, derived from the 72h max lateness. Global dedup would reshuffle all
# history every run (DDIA Ch 3). MUST equal manifest duplicates.dedup_window_hours
# or the 5 seeded out-of-window dups stop being out-of-window and the W5
# survival test breaks. That coupling is the point, not an accident.
dedup_window_hours: 72

# Used in W4.
quality_rules:
  # --- row-level rules: evaluated per row, failures go to the rejects table ---
  - { name: event_id_not_null,        type: row, column: event_id,        check: not_null }
  - { name: event_timestamp_not_null, type: row, column: event_timestamp, check: not_null }

  # --- aggregate rules: this session (assert loud / report and pass) ---
  # hard: exact invariant. The drift key must not exist before drift_day.
  # observed must be 0, not "close to 0", so this asserts and fails the run.
  - name: schema_drift_before_boundary
    type: aggregate
    severity: hard
    query: |
      SELECT COUNT(*) AS observed
      FROM bronze
      WHERE event_date < '2026-01-15'
        AND get_json_object(metadata, '$.network_type') IS NOT NULL
    assert: { op: eq, value: 0 }

  # soft: seeded skew. One game_id holds ~37% of events. Statistical, so report
  # expected-vs-observed and pass within tolerance.
  - name: hot_game_share
    type: aggregate
    severity: soft
    query: |
      SELECT MAX(share) AS observed FROM (
        SELECT game_id, COUNT(*) / (SELECT COUNT(*) FROM bronze) AS share
        FROM bronze GROUP BY game_id
      )
    expected: 0.37
    tolerance: 0.02

  # soft: 2-3% of events arrive later than the 300s normal-delay ceiling.
  # event time vs processing time, DDIA Ch 11.
  - name: late_arrival_rate
    type: aggregate
    severity: soft
    query: |
      SELECT
        SUM(CASE WHEN unix_timestamp(ingestion_timestamp) - unix_timestamp(event_timestamp) > 300
                 THEN 1 ELSE 0 END) / COUNT(*) AS observed
      FROM bronze
    expected: 0.025
    tolerance: 0.01